# Weekly dependency updates (OWASP A06). Minor and patch updates arrive as one grouped PR per ecosystem.
# MAJOR versions are never proposed automatically: a major bump (for example Tailwind 3 -> 4, which needs a new PostCSS
# plugin and a rewritten config) is a migration, done by hand in its own branch. Every PR also runs the `Verify`
# workflow (tests + production build), so a bump that breaks the build cannot merge unnoticed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
