name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node >= 22.23.4; check-latest skips an older cached 22.x on the runner
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run verify

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      # Blocking: production dependencies must have no high or critical advisories.
      # Moderate and dev-only (build tooling) advisories are tracked in docs/audits.
      - run: npm audit --omit=dev --audit-level=high
